name: Generate Documents Directory Listing

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-directory-listing:
    runs-on: ubuntu-latest
    name: Generate Directory Index

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # This terminal command searches the "documents" folder and all subfolders
      - name: Clean existing index.html files
        run: find documents -type f -name "index.html" -delete

      # This runs the plugin, using your specific FOLDER setting
      - name: Generate Directory Listings for Documents
        uses: jayanta525/github-pages-directory-listing@v4.0.0
        with:
          FOLDER: documents

      - name: Commit and Push Changes
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main
          folder: .
